name: CI

on:
  push:
    branches: [main, 'release/**', 'security/**']
    tags: ['v*']
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Script and Compose contracts
        run: |
          scripts/test-smoke-contract.sh
          scripts/test-compose-env-contract.sh
          scripts/test-public-compose-contract.sh
          scripts/test-try-compose-contract.sh
          scripts/test-docs-contract.sh
          python3 scripts/test-backup.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: mvn -q test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Frontend tests and build
        working-directory: frontend
        run: npm test && npm run build

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright GUI smoke
        working-directory: frontend
        run: npm run test:gui:smoke
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Resolve and audit the complete backend dependency inventory
        run: |
          mvn -B -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          python3 scripts/audit-runtime.py backend/target/bom.json
      - uses: google/osv-scanner-action/osv-scanner-action@v2.2.2
        with:
          scan-args: |-
            --lockfile=frontend/package-lock.json

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Full container smoke and restore verification
        run: |
          scripts/smoke.sh
          scripts/test-public-runtime.sh

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image for vulnerability scan
        run: docker build -t listful-thinking:ci .
      - name: Scan OS and application dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: listful-thinking:ci
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, backend, frontend, gui-smoke, dependency-scan, container-smoke, container-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name and verify release version
        id: image
        shell: bash
        run: |
          test -f LICENSE || { echo "A license is required before publishing a public image" >&2; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' backend/pom.xml | sed -n '2p')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match backend version $version" >&2
            exit 1
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 and arm64 images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SOURCE_CODE_URL=https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign published image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
