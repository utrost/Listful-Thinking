spring:
  application:
    name: listful-thinking
  datasource:
    url: jdbc:sqlite:${LISTFUL_DB_PATH:/app/data/listful-thinking.sqlite}
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    mixed: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}

server:
  port: 8080

listful:
  system-lang: ${SYSTEM_LANG:en}
  registration-enabled: ${REGISTRATION_ENABLED:false}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    rate-limit-enabled: ${RATE_LIMIT_ENABLED:true}
    rate-limit-max-requests: ${RATE_LIMIT_MAX_REQUESTS:60}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    rate-limit-max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:65536}
